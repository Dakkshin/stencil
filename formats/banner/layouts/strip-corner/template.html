<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OBA Zoom Banner — 640×200</title>
<style>
/* ---------------------------------------------------------------------------
   Fonts. Shared woff2 pool, borrowed from the sibling generator so all three
   tools rasterize identically. Relative paths resolve under file:// too.
   font-display:block (not swap) so document.fonts.ready actually gates the
   screenshot instead of rasterizing fallback glyphs.
--------------------------------------------------------------------------- */
@font-face { font-family:"Inter"; src:url("../../../../assets/fonts/Inter-300-normal.woff2") format("woff2"); font-weight:300; font-display:block; }
@font-face { font-family:"Inter"; src:url("../../../../assets/fonts/Inter-400-normal.woff2") format("woff2"); font-weight:400; font-display:block; }
@font-face { font-family:"Inter"; src:url("../../../../assets/fonts/Inter-500-normal.woff2") format("woff2"); font-weight:500; font-display:block; }
@font-face { font-family:"Inter"; src:url("../../../../assets/fonts/Inter-600-normal.woff2") format("woff2"); font-weight:600; font-display:block; }
@font-face { font-family:"IBM Plex Mono"; src:url("../../../../assets/fonts/IBM-Plex-Mono-500-normal.woff2") format("woff2"); font-weight:500; font-display:block; }
@font-face { font-family:"IBM Plex Mono"; src:url("../../../../assets/fonts/IBM-Plex-Mono-600-normal.woff2") format("woff2"); font-weight:600; font-display:block; }

/* ---------------------------------------------------------------------------
   IU design tokens — from iu-panel-social-posts/brands.mjs + brand-guidelines.
   Matches Depth (default) / Air grounds, glow, dots, scrim exactly.
   The strip uses a vertical top-down version of the same atmosphere.
--------------------------------------------------------------------------- */
:root {
  --ink-900:#12182B; --white:#ffffff;

  --gradient-hero: radial-gradient(135% 130% at 86% 6%,
    #1B2560 0%, #12182B 55%, #0A0F22 100%);
  --gradient-hero-glow: radial-gradient(62% 50% at 92% 12%,
    rgba(98,137,217,.30) 0%, rgba(98,137,217,0) 70%);
  --gradient-hero-glow-b: radial-gradient(60% 42% at 4% 98%,
    rgba(114,119,210,.22) 0%, rgba(114,119,210,0) 70%);

  --text-muted: rgba(255,255,255,.62);
  --text-faint: rgba(255,255,255,.44);
  --line: rgba(255,255,255,.14);
  --pill-bg: rgba(18,24,43,.42);
  --accent-warm:#6289D9;

  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* Geometry — inline defaults mirroring lib/geometry.mjs. */
  --pad-x:20px; --pad-top:8px; --pad-bottom:8px;
  --header-h:26px; --header-gap:4px; --band-gap:10px;
  --name-gap:6px; --role-gap:2px;
  --logo-h:26px;
  --type-title:16px; --type-title-lh:1.18;
  --type-body:11px; --type-body-lh:1.25;

  --tile-w:86px; --tile-h:75px; --col-w:150px; --col-gap:26px;
}

* { box-sizing:border-box; margin:0; padding:0; }
html,body { background:#0d151b; font-family:var(--font-sans); }
body { display:flex; align-items:flex-start; justify-content:center; padding:24px; }

/* ---------------------------------------------------------------------------
   The canvas. Everything inside is what gets screenshotted; the editor chrome
   below lives outside it and never appears in the PNG.
--------------------------------------------------------------------------- */
#stage { transform-origin: top center; }
.canvas {
  position:relative; width:640px; height:200px; overflow:hidden;
  background: var(--gradient-hero);
  color: var(--white);
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.layer { position:absolute; inset:0; pointer-events:none; }
.glow  { background: var(--gradient-hero-glow); }
.glow-b { background: var(--gradient-hero-glow-b); }
/* Bottom-up scrim tuned to IU Depth. Overridden per-brand via JS. */
.scrim {
  background: linear-gradient(180deg, rgba(18,24,43,0) 38%, rgba(18,24,43,.34) 72%, rgba(18,24,43,.58) 100%);
}
.arcs { opacity: 1; }
.arcs svg { width:640px; height:200px; display:block; }
.pace-logo { height:14px; width:auto; flex:none; background:#fff; border-radius:3px; padding:1px 3px; }
#ceStampWrap { position:absolute; right:4px; bottom:4px; width:68px; height:68px; z-index:10; pointer-events:none; }

/* --- header row ---------------------------------------------------------- */
.header {
  position:relative; z-index:3; flex:none;
  height:var(--header-h);
  display:flex; align-items:center; gap:10px;
}
.logo { height:var(--logo-h); width:auto; opacity:.96; flex:none; }
.wordmark {
  font-size:var(--type-title); font-weight:600; letter-spacing:-.01em; flex:none;
}
.eyebrow {
  display:inline-flex; align-items:center; gap:10px; min-width:0;
  font-family:var(--font-mono); font-size:var(--type-body); font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--text-muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.eyebrow::before {
  content:""; width:6px; height:6px; border-radius:50%;
  background:var(--accent-warm); flex:none;
}
.eyebrow.is-hidden, .date-chip.is-hidden, .logo.is-hidden, .wordmark.is-hidden, .pace-logo.is-hidden { display:none; }
.date-chip {
  margin-left:auto; flex:none;
  font-family:var(--font-mono); font-size:var(--type-body); font-weight:500;
  letter-spacing:.10em; text-transform:uppercase; white-space:nowrap;
  background:var(--pill-bg); border:1px solid var(--line);
  border-radius:999px; padding:3px 9px;
}

/* --- title --------------------------------------------------------------- */
.title {
  position:relative; z-index:3; flex:none;
  margin-top:var(--header-gap);
  font-size:var(--type-title); font-weight:500;
  line-height:var(--type-title-lh); letter-spacing:-.02em;
  text-align:center; text-wrap:balance;
}
.title .accent { color:var(--accent-warm); }

/* --- panelist band ------------------------------------------------------- */
.panel-row {
  position:relative; z-index:3;
  margin-top:var(--band-gap);
  flex:1; min-height:0;
  display:flex; align-items:flex-start; justify-content:center;
  gap:var(--col-gap);
}
.p-item { width:var(--col-w); display:flex; flex-direction:column; align-items:center; }
.tile {
  position:relative; width:var(--tile-w); height:var(--tile-h);
  border-radius:6px; overflow:hidden; flex:none;
  border:1px solid rgba(255,255,255,.22);
  background:linear-gradient(165deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 42%, rgba(11,18,32,.35) 100%);
  box-shadow:0 8px 20px -8px rgba(11,18,32,.7), inset 0 0 0 1px rgba(255,255,255,.04);
  display:flex; align-items:center; justify-content:center;
}
.tile img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.monogram {
  font-size:22px; font-weight:300; color:var(--mono-text, rgba(255,255,255,.72)); letter-spacing:.02em;
}
.p-name {
  margin-top:var(--name-gap);
  font-size:var(--type-body); font-weight:500; line-height:var(--type-body-lh);
  text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:100%;
}
.p-role {
  margin-top:var(--role-gap);
  font-size:var(--type-body); font-weight:400; line-height:var(--type-body-lh);
  color:var(--text-faint); text-align:center; text-wrap:balance;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden;
}

/* --- editor chrome (never screenshotted) --------------------------------- */
#editor { width:640px; margin:20px auto 0; color:#d7e1e6; font-size:12px; }
#editor textarea {
  width:100%; height:260px; background:#101b22; color:#d7e1e6;
  border:1px solid #24343d; border-radius:6px; padding:10px;
  font-family:var(--font-mono); font-size:11px; line-height:1.5;
}
#editor button {
  margin-top:8px; background:var(--accent-600); color:#fff; border:0;
  border-radius:5px; padding:7px 14px; font-size:12px; cursor:pointer;
}
#editor .hint { opacity:.6; margin-bottom:6px; }
</style>
</head>
<body>

<div id="stage">
  <div class="canvas" id="canvas">
    <div class="layer glow"></div>
    <div class="layer glow-b"></div>
    <div class="layer scrim" id="scrimLayer"></div>
    <div class="layer arcs" id="arcsLayer"></div>

    <div class="header">
      <img class="logo is-hidden" id="logo" alt="" />
      <div class="wordmark is-hidden" id="wordmark"></div>
      <img class="pace-logo is-hidden" id="paceLogo" alt="PACE" />
      <div class="eyebrow" id="eyebrow"></div>
      <div class="date-chip" id="dateChip"></div>
    </div>
    <div id="ceStampWrap"></div>

    <h1 class="title" id="title"></h1>

    <div class="panel-row" id="panelRow"></div>
  </div>
</div>

<div id="editor">
  <div class="hint">Edit the JSON and hit Apply — this is the same shape gen.mjs writes to .gen/&lt;name&gt;.json</div>
  <textarea id="cfgText" spellcheck="false"></textarea>
  <button id="applyBtn">Apply</button>
</div>

<script>
/* ---------------------------------------------------------------------------
   Geometry defaults — mirror lib/geometry.mjs. render.mjs injects the exact
   Node-side numbers via window.__setGeometry() before screenshotting.

   Tile size is COMPUTED, not tabled: the face band is bottom-anchored and
   absorbs whatever the header and title leave behind, so a two-line title
   shrinks the tiles instead of overflowing the canvas.
--------------------------------------------------------------------------- */
const GEO = {
  h: 200, padTop: 8, padBottom: 8,
  headerH: 26, headerGap: 4, bandGap: 10, nameGap: 6, roleGap: 2, roleLines: 2,
  title: 16, titleLh: 1.18, body: 11, bodyLh: 1.25,
};
const COLUMN_W = { 1: 200, 2: 160, 3: 150, 4: 142 };
const COLUMN_GAP = { 1: 0, 2: 30, 3: 26, 4: 10 };
const TILE_ASPECT = { 1: 1.4, 2: 1.35, 3: 1.15, 4: 1.0 };

function computeTile(titleLines, count) {
  const n = Math.max(1, Math.min(4, count || 1));
  const lines = Math.max(1, Math.min(2, titleLines || 1));
  const titleH = Math.round(GEO.title * GEO.titleLh * lines);
  const nameH = Math.round(GEO.body * GEO.bodyLh);
  const roleH = Math.round(GEO.body * GEO.bodyLh * GEO.roleLines);
  const consumed =
    GEO.padTop + GEO.headerH + GEO.headerGap + titleH + GEO.bandGap +
    GEO.nameGap + nameH + GEO.roleGap + roleH + GEO.padBottom;
  const tileH = Math.max(40, GEO.h - consumed);
  const tileW = Math.min(Math.round(tileH * TILE_ASPECT[n]), COLUMN_W[n] - 24);
  return { tileH, tileW };
}

window.__setGeometry = (g) => {
  Object.assign(GEO, g || {});
  const r = document.documentElement.style;
  const px = (k, v) => r.setProperty(k, v + "px");
  if (g.padX != null) px("--pad-x", g.padX);
  if (g.padTop != null) px("--pad-top", g.padTop);
  if (g.padBottom != null) px("--pad-bottom", g.padBottom);
  if (g.headerH != null) px("--header-h", g.headerH);
  if (g.headerGap != null) px("--header-gap", g.headerGap);
  if (g.bandGap != null) px("--band-gap", g.bandGap);
  if (g.nameGap != null) px("--name-gap", g.nameGap);
  if (g.roleGap != null) px("--role-gap", g.roleGap);
  if (g.logoH != null) px("--logo-h", g.logoH);
  if (g.title != null) px("--type-title", g.title);
  if (g.titleLh != null) r.setProperty("--type-title-lh", String(g.titleLh));
  if (g.body != null) px("--type-body", g.body);
  if (g.bodyLh != null) r.setProperty("--type-body-lh", String(g.bodyLh));
};

/* Brand override. Everything brand-dependent comes from the brand object: its
   palette, and `strip`, the banner's own values (formats.banner.tokens.strip in
   brands/<id>.mjs): tone ("dark" radial ground or "light" diagonal ground),
   the two glow lobes, and whether the PACE plate shows. No brand id is tested,
   so any brand can wear this corner-lobe design. */
const rgba = (hex, a) => {
  const n = parseInt(String(hex).slice(1), 16);
  return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
};
window.__setBrand = (b) => {
  if (!b) return;
  window.__currentBrand = b;
  const r = document.documentElement.style;
  const s = b.strip || {};
  const light = s.tone === "light";
  if (Array.isArray(b.gradient) && b.gradient.length) {
    const stops = b.gradient.map(([c, p]) => `${c} ${p}%`).join(", ");
    r.setProperty("--gradient-hero", light
      ? `linear-gradient(151deg, ${stops})`
      : `radial-gradient(135% 130% at 86% 6%, ${stops})`);
  }
  /* Lobe A is the brand glow on a dark ground and strip.lobeA on a light one
     (as the fork drew it; the SVG twin always uses strip.lobeA). */
  const A = s.lobeA || { color: "#8BB3E2", alpha: 0.38 };
  const B = s.lobeB || { color: "#7277D2", alpha: 0.22 };
  if (light) {
    r.setProperty("--gradient-hero-glow",
      `radial-gradient(60% 50% at 92% 10%, ${rgba(A.color, A.alpha)} 0%, ${rgba(A.color, 0)} 70%)`);
    r.setProperty("--gradient-hero-glow-b",
      `radial-gradient(60% 42% at 5% 96%, ${rgba(B.color, B.alpha)} 0%, ${rgba(B.color, 0)} 70%)`);
  } else if (b.glow) {
    r.setProperty("--gradient-hero-glow",
      `radial-gradient(62% 50% at 92% 12%, ${b.glow} 0%, rgba(0,0,0,0) 70%)`);
    r.setProperty("--gradient-hero-glow-b",
      `radial-gradient(60% 42% at 4% 98%, ${rgba(B.color, B.alpha)} 0%, ${rgba(B.color, 0)} 70%)`);
  }
  if (b.accent) r.setProperty("--accent-600", b.accent);
  if (b.line) r.setProperty("--line", b.line);
  if (b.textMuted) r.setProperty("--text-muted", b.textMuted);
  if (b.textFaint) r.setProperty("--text-faint", b.textFaint);
  if (b.pillBg) r.setProperty("--pill-bg", b.pillBg);
  if (b.titleText) {
    r.setProperty("--white", b.titleText);
    const cv = document.getElementById("canvas");
    if (cv) cv.style.color = b.titleText;
  }
  if (b.monoText) r.setProperty("--mono-text", b.monoText);
  r.setProperty("--accent-warm", b.titleAccent || b.accent || "#6289D9");
  // scrim from brand.scrim ([offset, color, alpha])
  if (Array.isArray(b.scrim) && b.scrim.length) {
    const stops = b.scrim.map(([o, c, a]) => {
      // hex -> rgba for gradient
      const m = String(c).match(/^#([0-9a-f]{6})$/i);
      let col = c;
      if (m) {
        const n = parseInt(m[1], 16);
        col = `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
      }
      return `${col} ${Math.round(o*100)}%`;
    }).join(", ");
    const sc = document.getElementById("scrimLayer");
    if (sc) sc.style.background = `linear-gradient(180deg, ${stops})`;
  }
  buildArcs(b);
};

function buildArcs(b) {
  const el = document.getElementById("arcsLayer");
  if (!el) return;
  b = b || window.__currentBrand || {};
  const W = 640, H = 200;
  const cx = -0.26 * W, cy = 1.22 * H;
  const color = b.arc || "#8BB3E2";
  const op = b.arcOpacity || [0.08, 0.03];
  const gap = 22;
  const far = Math.hypot(W - cx, 0 - cy);
  const r0 = 0.28 * Math.min(W, H);
  const steps = Math.floor((far - r0) / gap) + 1;
  let s = `<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">`;
  for (let i = 0; i < steps; i++) {
    const rr = r0 + i * gap;
    const t = i / Math.max(1, steps - 1);
    const o = (op[0] + (op[1] - op[0]) * t).toFixed(3);
    s += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="none" stroke="${color}" stroke-width="1.1" stroke-opacity="${o}"/>`;
  }
  s += `</svg>`;
  el.innerHTML = s;
}

function buildCeStampSVG(ce, brand, isLight) {
  const m = String(ce || "").trim().match(/^(\d+(?:\.\d+)?)\s*(.*)$/);
  const num = m ? m[1] : "1";
  const label = (m ? (m[2] || "CE credit") : "CE credit").toUpperCase();
  const seal = brand.ceSeal || (isLight ? "#2A3A71" : "#C8DDF5");
  const ink = brand.ceInk || (isLight ? "#FFFFFF" : "#12182B");
  const hair = isLight ? "rgba(255,255,255,0.45)" : "rgba(18,24,43,0.35)";
  const r = 32, cx = 34, cy = 34, rotate = -10;
  const teeth = 40;
  let d = "";
  for (let i = 0; i < teeth * 2; i++) {
    const a = (Math.PI * i) / teeth;
    const rad = i % 2 === 0 ? r : r * 0.93;
    d += `${i===0?"M":"L"}${(cx + rad*Math.cos(a)).toFixed(1)} ${(cy + rad*Math.sin(a)).toFixed(1)} `;
  }
  d += "Z";
  const letters = "CONTINUINGCECOMPL";
  const rfSize = 5.2, rt = r * 0.70;
  let glyphs = "";
  const step = (2*Math.PI)/letters.length;
  let ang = -Math.PI/2;
  for (let i = 0; i < letters.length; i++) {
    const ch = letters[i];
    const mid = ang + step/2;
    const gx = cx + rt*Math.cos(mid), gy = cy + rt*Math.sin(mid);
    const deg = (mid*180)/Math.PI + 90;
    glyphs += `<g transform="rotate(${deg.toFixed(1)} ${gx.toFixed(1)} ${gy.toFixed(1)})"><text x="${gx.toFixed(1)}" y="${(gy-rfSize*0.4).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="${rfSize}" fill="${ink}">${ch}</text></g>`;
    ang += step;
  }
  return `<svg width="68" height="68" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg"><g transform="rotate(${rotate} ${cx} ${cy})"><path d="${d}" fill="${seal}"/><circle cx="${cx}" cy="${cy}" r="${(r*0.86).toFixed(1)}" fill="none" stroke="${hair}" stroke-width="1.2"/><circle cx="${cx}" cy="${cy}" r="${(r*0.60).toFixed(1)}" fill="none" stroke="${hair}" stroke-width="1.2"/>${glyphs}<text x="${cx}" y="${(cy-4).toFixed(1)}" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="${ink}">${num}</text><text x="${cx}" y="${(cy+10).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7" font-weight="600" fill="${ink}">${label}</text></g></svg>`;
}

/* Initials for the missing-photo fallback. Same derivation as the siblings:
   drop trailing credentials, take the first two words. */
function monogram(name) {
  return String(name || "")
    .replace(/,.*$/, "")
    .split(/[\s·–—-]+/).filter(Boolean).slice(0, 2)
    .map((w) => w[0]).join("").toUpperCase() || "?";
}

/* `~` toggles the accent colour: "A ~B~ C" -> A normal, B accent, C normal. */
function renderTitle(el, title) {
  el.textContent = "";
  const parts = String(title || "").split("~");
  parts.forEach((text, i) => {
    if (!text) return;
    const span = document.createElement("span");
    if (i % 2 === 1) span.className = "accent";
    span.textContent = text;
    el.appendChild(span);
  });
}

function setText(id, value) {
  const el = document.getElementById(id);
  el.textContent = value || "";
  el.classList.toggle("is-hidden", !value);
  return el;
}

function applyConfig(cfg) {
  cfg = cfg || {};
  window.__currentConfig = cfg;

  if (cfg.brand) window.__setBrand(cfg.brand);

  const strip = (cfg.brand && cfg.brand.strip) || {};
  const isLight = strip.tone === "light";

  /* Logo asset when available, text wordmark when not. */
  const logo = document.getElementById("logo");
  const wordmark = document.getElementById("wordmark");
  if (cfg.logo) {
    logo.src = cfg.logo;
    logo.classList.remove("is-hidden");
    wordmark.classList.add("is-hidden");
  } else {
    logo.classList.add("is-hidden");
    wordmark.textContent = (cfg.brand && cfg.brand.wordmark) || "IU";
    wordmark.classList.remove("is-hidden");
  }

  setText("eyebrow", cfg.eyebrow);
  setText("dateChip", cfg.date);

  const titleEl = document.getElementById("title");
  renderTitle(titleEl, cfg.title);

  const list = Array.isArray(cfg.panelists) ? cfg.panelists.slice(0, 4) : [];
  const n = Math.max(1, Math.min(4, list.length || 1));
  const r = document.documentElement.style;
  r.setProperty("--col-w", COLUMN_W[n] + "px");
  r.setProperty("--col-gap", COLUMN_GAP[n] + "px");

  const row = document.getElementById("panelRow");
  row.textContent = "";
  list.forEach((p) => {
    const item = document.createElement("div");
    item.className = "p-item";

    const tile = document.createElement("div");
    tile.className = "tile";
    const mono = document.createElement("div");
    mono.className = "monogram";
    mono.textContent = p.placeholder ? "?" : monogram(p.name);
    tile.appendChild(mono);
    if (p.img) {
      const img = document.createElement("img");
      img.src = p.img;
      img.onerror = function () { this.style.display = "none"; };
      tile.appendChild(img);
    }
    item.appendChild(tile);

    const name = document.createElement("div");
    name.className = "p-name";
    name.textContent = p.placeholder ? "" : (p.name || "");
    item.appendChild(name);

    const role = document.createElement("div");
    role.className = "p-role";
    role.textContent = p.placeholder ? "" : (p.role || "");
    item.appendChild(role);

    row.appendChild(item);
  });

  // PACE logo in header (PNG path needs explicit asset; SVG path embeds base64)
  const paceEl = document.getElementById("paceLogo");
  if (cfg.ce && strip.pace) {
    paceEl.src = "../../../../assets/logos/pace-academy-logo.png";
    paceEl.classList.remove("is-hidden");
    // append CE to eyebrow like SVG renderer does
    let cred = String(cfg.ce).replace(/\s*credits?/i, "").trim().toUpperCase();
    if (!/CE/i.test(cred)) cred = cred + " CE";
    const eb = document.getElementById("eyebrow");
    if (eb && cred && !eb.textContent.includes("CE")) eb.textContent = (eb.textContent ? eb.textContent + "  ·  " : "") + cred;
  } else {
    paceEl.classList.add("is-hidden");
  }

  // Full-detail CE stamp (matches render-svg.mjs smallCeStampIfNeeded)
  const wrap = document.getElementById("ceStampWrap");
  if (wrap) {
    wrap.innerHTML = "";
    if (cfg.ce) {
      wrap.innerHTML = buildCeStampSVG(cfg.ce, cfg.brand || {}, isLight);
    }
  }

  /* Measure the title AFTER it is in the DOM, then size the tiles to whatever
     height is left. This is why a long title shrinks faces instead of
     spilling past the bottom edge. */
  const lineH = GEO.title * GEO.titleLh;
  const titleLines = Math.max(1, Math.min(2, Math.round(titleEl.offsetHeight / lineH)));
  const { tileW, tileH } = computeTile(titleLines, n);
  r.setProperty("--tile-w", tileW + "px");
  r.setProperty("--tile-h", tileH + "px");
  window.__titleLines = titleLines;
}
window.applyConfig = applyConfig;

function setPreviewScale(s) {
  document.getElementById("stage").style.transform = `scale(${s})`;
}
window.setPreviewScale = setPreviewScale;
