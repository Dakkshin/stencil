<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insurance Untangled, Episode Thumbnail Template</title>

<!--
  ┌────────────────────────────────────────────────────────────────────────────┐
  │  Insurance Untangled episode thumbnail template (1280 × 720)               │
  │                                                                            │
  │  THIS IS THE SOURCE. The shipped template is iu-thumbnail-template.html,   │
  │  produced from this file by scripts/build-template.mjs, which inlines the  │
  │  brand fonts, the logos, the atmosphere, the petal mark and the shared     │
  │  layout code (lib/layout.mjs + lib/geometry.mjs). Do not edit the output.  │
  │                                                                            │
  │  Every box below is computed by compose() from lib/layout.mjs, the same    │
  │  function render-svg.mjs runs, so the PNG and the Canva SVG agree by        │
  │  construction. This file only paints what compose() places.                │
  │                                                                            │
  │  Logo: light theme uses the full-colour master artwork; dark theme uses    │
  │  the reversed-white vector lockup. Neither is recolored or redrawn.        │
  └────────────────────────────────────────────────────────────────────────────┘
-->

<style>
/* __FONT_FACES__ */

/* ============================================================
   Brand tokens
   ============================================================ */
:root {
  --ink950: #12182B;
  --charcoal: #2B2B2C;
  --iu-navy: #2A3A71;
  --iu-blue: #4D7BAC;
  --clarity: #6289D9;
  --indigo: #7277D2;
  --sky: #8BB3E2;
  --powder: #C8DDF5;
  --cloud: #F4F7FB;
  --rule: #D8E0EB;

  --font-display: "InterDisplay", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-serif: "EBGaramond", "EB Garamond", Georgia, "Times New Roman", serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #0b1020;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ============================================================
   Toolbar (never exported)
   ============================================================ */
.toolbar {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 14px 20px;
  background: #0f1630;
  border-bottom: 1px solid rgba(255,255,255,.08);
  color: rgba(255,255,255,.88);
  position: sticky; top: 0; z-index: 20;
}
.tb-title { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
.tb-sub {
  display: block; font-family: var(--font-sans); font-size: 11px;
  letter-spacing: .08em; text-transform: uppercase;
  color: rgba(255,255,255,.45); margin-top: 2px;
}
.tb-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tb-actions button {
  font: 500 12px var(--font-sans); letter-spacing: .02em;
  color: rgba(255,255,255,.78);
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px; padding: 7px 14px; cursor: pointer;
  transition: background .15s ease, color .15s ease;
}
.tb-actions button:hover { background: rgba(255,255,255,.12); }
.tb-actions button.active { background: rgba(255,255,255,.17); color: #fff; border-color: rgba(255,255,255,.32); }

.stage { margin: 24px auto; position: relative; transform-origin: top left; }

/* ============================================================
   Canvas + themes
   ============================================================ */
.canvas {
  width: 1280px; height: 720px; position: relative; overflow: hidden;
  padding: 72px 64px;
  font-family: var(--font-sans);
}

/* dark: Depth ground. Ink owns the frame, navy holds the crown. */
.canvas.theme-dark {
  --ground: radial-gradient(125% 135% at 86% 8%, #1B2560 0%, #12182B 55%, #0A0F22 100%);
  --fg: #ffffff;
  --kicker: #8BB3E2;
  --chip-bg: rgba(244,247,251,.10);
  --chip-line: rgba(255,255,255,.20);
  --chip-fg: #E7EEF9;
  --lobe-a: radial-gradient(closest-side, rgba(98,137,217,.34), rgba(98,137,217,0));
  --lobe-b: radial-gradient(closest-side, rgba(114,119,210,.26), rgba(114,119,210,0));
  --iu-arc: #8BB3E2;
  --iu-motif-a: #8BB3E2;
  --iu-motif-b: #6289D9;
  --card-shadow: 0 24px 48px rgba(4,8,20,.5);
  --ground-fallback: #12182B;
}

/* light: Air ground. */
.canvas.theme-light {
  --ground: linear-gradient(158deg, #FFFFFF 0%, #F4F7FB 46%, #C8DDF5 100%);
  --fg: #12182B;
  --kicker: #4D7BAC;
  --chip-bg: rgba(255,255,255,.85);
  --chip-line: #D8E0EB;
  --chip-fg: #2A3A71;
  --lobe-a: radial-gradient(closest-side, rgba(139,179,226,.42), rgba(139,179,226,0));
  --lobe-b: radial-gradient(closest-side, rgba(98,137,217,.20), rgba(98,137,217,0));
  --iu-arc: #4D7BAC;
  --iu-motif-a: #4D7BAC;
  --iu-motif-b: #2A3A71;
  --card-shadow: 0 20px 40px rgba(42,58,113,.3);
  --ground-fallback: #F4F7FB;
}

.canvas { background: var(--ground, var(--ground-fallback)); color: var(--fg); }

/* ---- background layers ---- */
.layer { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.lobe-a { background: var(--lobe-a); inset: -18% -12% auto auto; width: 66%; height: 92%; }
.lobe-b { background: var(--lobe-b); inset: auto auto -26% -10%; width: 62%; height: 78%; }
/* The arc field: geometry injected verbatim (the fragment render-svg.mjs emits),
   colours from the theme custom properties above. */
.atmos { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ============================================================
   Top bar — lockup left, episode chip right
   ============================================================ */
.top {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  gap: 24px; margin-bottom: 24px;
}
.brand { display: inline-flex; align-items: center; line-height: 0; }
/* The lockup sits directly on the ground (no plate), held quiet at 152 px. */
.logo { width: 152px; height: auto; display: block; }
.eyebrow {
  display: inline-flex; align-items: center;
  height: 32px; padding: 0 16px;
  font-family: var(--font-sans); font-size: 12px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--chip-fg);
  background: var(--chip-bg);
  border: 1px solid var(--chip-line);
  border-radius: 999px;
  white-space: nowrap;
}

/* ============================================================
   Lead — kicker + claim (placed by compose())
   ============================================================ */
.lead { position: absolute; z-index: 2; }
/* A plain line: no leading rule, which read as an em dash. */
.kicker {
  display: block; height: 16px; line-height: 16px; margin: 0 0 24px;
  font-family: var(--font-sans); font-size: 13px; font-weight: 600;
  letter-spacing: .18em; text-transform: uppercase; white-space: nowrap;
  color: var(--kicker);
}
/* Lines come pre-broken from compose(), so the browser never re-wraps them. */
.title {
  margin: 0; white-space: nowrap;
  font-family: var(--font-display); font-weight: 600;
  font-size: 60px; line-height: 1.05; letter-spacing: -.022em;
  color: var(--fg);
}
.canvas.size-2 .title { font-size: 48px; }
.canvas.size-3 .title { font-size: 52px; }
/* The editorial turn: EB Garamond italic, same colour as the claim, no swipe. */
.title .accent {
  font-family: var(--font-serif); font-style: italic; font-weight: 500;
  font-size: 0.82em;
}
/* The petal: punctuation after the last line, as on the social posts. */
.mark { position: absolute; z-index: 2; display: block; overflow: visible; }
.mark.hidden { display: none; }

/* ============================================================
   Cards — every guest stands in one rounded portrait card
   ============================================================
   compose() places each card, frames each picture and sizes each label. The
   card fill is a navy brand gradient on both themes, so cut-outs read as one
   studio; plain photos cover it. */
.people { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
.card {
  position: absolute; margin: 0; overflow: hidden;
  background: linear-gradient(180deg, #4D7BAC 0%, #2A3A71 100%);
  box-shadow: var(--card-shadow);
}
/* The hairline is drawn above the picture, so the image fills the whole card. */
.card::after {
  content: ""; position: absolute; inset: 0; z-index: 2;
  border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
}
.card img { position: absolute; display: block; max-width: none; }
.card img.cover { left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
.card img.contain { left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; }
.mono {
  position: absolute; left: 0; text-align: center;
  font-family: var(--font-display); font-weight: 600; letter-spacing: -.02em;
  color: rgba(255,255,255,.42);
}

/* The label: name + designation · company, docked bottom-left inside the card. */
.label {
  position: absolute; z-index: 3;
  background: rgba(10,15,34,.72);
  border: 1px solid rgba(255,255,255,.14);
}
.lname {
  font-family: var(--font-display); font-weight: 600;
  line-height: 1.2; color: #FFFFFF; white-space: nowrap;
}
.lmeta {
  font-family: var(--font-sans); font-weight: 500;
  line-height: 1.35; color: rgba(255,255,255,.74); white-space: nowrap;
}

/* ============================================================
   JSON editor (never exported)
   ============================================================ */
.editor { max-width: 1280px; margin: 0 auto 40px; padding: 0 20px; }
.editor textarea {
  width: 100%; height: 320px; resize: vertical;
  background: #0b1020; color: #d7e1ee;
  border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 14px;
  font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; outline: none;
}
.editor textarea:focus { border-color: rgba(255,255,255,.35); }
.editor-actions { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.editor-actions button {
  font: 500 13px var(--font-sans); color: #0b1020; background: #fff;
  border: 1px solid rgba(255,255,255,.3); border-radius: 8px; padding: 8px 16px; cursor: pointer;
}
.editor-actions button.secondary { background: transparent; color: rgba(255,255,255,.78); }
.editor .err { font: 12px ui-monospace, monospace; color: #ff9b9b; margin-left: 6px; }
.hidden { display: none; }
</style>
</head>
<body>

  <div class="toolbar" id="toolbar">
    <div>
      <span class="tb-title">Insurance Untangled, Episode Thumbnail</span>
      <span class="tb-sub">1280 × 720 · 16:9 · dark + light</span>
    </div>
    <div class="tb-actions">
      <button data-demo="dark-solo" class="active">Dark · Solo</button>
      <button data-demo="light-solo">Light · Solo</button>
      <button data-demo="dark-duo">Dark · Duo</button>
      <button data-demo="light-panel">Light · Panel</button>
      <button data-demo="dark-crowd">Dark · Crowd</button>
      <button id="editBtn">Edit JSON</button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="canvas theme-dark" id="canvas" role="img" aria-label="Insurance Untangled episode thumbnail preview">
      <div class="layer lobe-a"></div>
      <div class="layer lobe-b"></div>
      <div class="layer" aria-hidden="true">
        <svg class="atmos" viewBox="0 0 1280 720" preserveAspectRatio="none">
          <!-- __ATMOSPHERE__ -->
        </svg>
      </div>

      <header class="top">
        <div class="brand">
          <img class="logo" id="logo" src="__LOGO_DATA_URI__" alt="Insurance Untangled">
        </div>
        <span class="eyebrow" id="eyebrow"></span>
      </header>

      <div class="lead" id="lead">
        <div class="kicker" id="kicker"></div>
        <h1 class="title" id="title"></h1>
      </div>
      <svg class="mark hidden" id="mark" viewBox="0 4 536 1344" preserveAspectRatio="none" aria-hidden="true"><!-- __PETAL__ --></svg>

      <div class="people" id="people"></div>
    </div>
  </div>

  <div class="editor hidden" id="editor">
    <textarea id="cfgText" spellcheck="false" aria-label="Thumbnail configuration JSON"></textarea>
    <div class="editor-actions">
      <button id="applyCfg">Render</button>
      <button id="copyCfg" class="secondary">Copy JSON</button>
      <button id="closeEditor" class="secondary">Close</button>
      <span class="err" id="cfgErr"></span>
    </div>
  </div>

<script>
/* __GEOMETRY__ */

/* ============================================================
   Demo presets (mirror examples/*.json)
   ============================================================ */
const DEMOS = {
  "dark-solo": {
    mode: "dark",
    eyebrow: "Insurance Untangled · Ep 148",
    hook: "Where the money goes",
    category: "Practice Economics",
    title: [
      { text: "You negotiated your fees.", br: true },
      { text: "Did the money reach the bottom line?", br: true, dim: true },
    ],
    guests: [{ name: "Guest Name", role: "Practice Owner", company: "Smith Dental Group" }],
  },
  "light-solo": {
    mode: "light",
    eyebrow: "Insurance Untangled · Ep 149",
    hook: "The hidden cost of write-offs",
    category: "Payer Strategy",
    title: [
      { text: "The write-off is visible.", br: true },
      { text: "The opportunity cost usually isn't.", br: true, dim: true },
    ],
    guests: [{ name: "Guest Name", role: "Founder", company: "Smith Dental Group" }],
  },
  "dark-duo": {
    mode: "dark",
    eyebrow: "Insurance Untangled · Ep 150",
    hook: "More production, less control",
    category: "Team & Operations",
    title: [
      { text: "More production does not", br: true },
      { text: "mean more control.", br: true },
    ],
    guests: [
      { name: "First Speaker", role: "Founder", company: "Bright Smiles Group" },
      { name: "Second Speaker", role: "Host", company: "Insurance Untangled" },
    ],
  },
  "light-panel": {
    mode: "light",
    eyebrow: "Insurance Untangled · Ep 151",
    hook: "Before you drop a plan",
    category: "Benchmarks · Claims",
    title: [{ text: "Map what it actually contributes.", br: true }],
    guests: [
      { name: "Speaker One", role: "Owner", company: "Lakeside Dental" },
      { name: "Speaker Two", role: "CFO", company: "North Dental Group" },
      { name: "Speaker Three", role: "Consultant", company: "Payer Advisors" },
      { name: "Speaker Four", role: "Founder", company: "Smile Studio" },
    ],
  },
  "dark-crowd": {
    mode: "dark",
    eyebrow: "Insurance Untangled · Ep 152",
    hook: "Eight voices, one problem",
    category: "Panel · Live",
    title: [
      { text: "Eight voices on", br: true },
      { text: "the same problem.", br: true },
    ],
    guests: ["A One", "B Two", "C Three", "D Four", "E Five", "F Six", "G Seven", "H Eight"].map((name) => ({ name })),
  },
};

/* Full-colour master lockup for light grounds; reversed-white vector for dark. */
const LOGO_COLOUR = "__LOGO_DATA_URI__";
const LOGO_REVERSED = "__LOGO_REVERSED_DATA_URI__";

const canvas = document.getElementById("canvas");
const stage = document.getElementById("stage");
const $logo = document.getElementById("logo");
const $eyebrow = document.getElementById("eyebrow");
const $lead = document.getElementById("lead");
const $kicker = document.getElementById("kicker");
const $title = document.getElementById("title");
const $mark = document.getElementById("mark");
const $people = document.getElementById("people");

const px = (v) => v + "px";
function place(el, box, origin = { x: 0, y: 0 }) {
  el.style.left = px(box.x - origin.x);
  el.style.top = px(box.y - origin.y);
  el.style.width = px(box.w);
  el.style.height = px(box.h);
}
function div(cls, text) {
  const el = document.createElement("div");
  el.className = cls;
  if (text !== undefined) el.textContent = text;
  return el;
}

function render(cfg) {
  const mode = cfg.mode === "light" ? "light" : "dark";
  const L = compose(IU_GEOM, cfg);

  canvas.className = `canvas theme-${mode} size-${L.sizeTier} ${L.band ? "band" : "row"}`;
  $logo.src = mode === "light" ? LOGO_COLOUR : LOGO_REVERSED;
  $eyebrow.textContent = L.eyebrow;
  $kicker.textContent = L.kicker;

  /* Lead: positioned by compose(); lines arrive pre-broken. */
  $lead.style.left = px(L.lead.x);
  $lead.style.top = px(L.lead.y);
  $lead.style.width = px(L.lead.w);
  $title.innerHTML = "";
  for (const line of L.lines) {
    const span = document.createElement("span");
    span.className = line.accent ? "accent" : "line";
    span.textContent = line.text;
    $title.appendChild(span);
    $title.appendChild(document.createElement("br"));
  }
  if (L.mark) {
    $mark.classList.remove("hidden");
    place($mark, L.mark);
  } else {
    $mark.classList.add("hidden");
  }

  /* Cards: fill, picture, hairline (::after), label. */
  $people.innerHTML = "";
  for (const p of L.people) {
    const card = document.createElement("figure");
    card.className = "card";
    place(card, p.card);
    card.style.borderRadius = px(L.radius);

    if (p.image.kind === "mono") {
      const m = p.mono;
      const mono = div("mono", m.text);
      mono.style.top = px(m.cy - p.card.y - m.size / 2);
      mono.style.width = px(p.card.w);
      mono.style.height = px(m.size);
      mono.style.fontSize = px(m.size);
      mono.style.lineHeight = px(m.size);
      card.appendChild(mono);
    } else {
      const img = document.createElement("img");
      img.src = p.guest.img;
      img.alt = p.guest.name || "";
      if (p.image.kind === "framed") place(img, p.image, p.card);
      else img.className = p.image.kind;
      card.appendChild(img);
    }

    if (p.label) {
      const b = p.label;
      const label = div("label");
      place(label, b, p.card);
      label.style.borderRadius = px(b.radius);
      label.style.padding = `${b.padY}px ${b.padX}px`;
      const name = div("lname", b.name);
      name.style.fontSize = px(b.nameSize);
      label.appendChild(name);
      if (b.meta) {
        const meta = div("lmeta", b.meta);
        meta.style.fontSize = px(b.metaSize);
        meta.style.marginTop = px(b.gap);
        label.appendChild(meta);
      }
      card.appendChild(label);
    }
    $people.appendChild(card);
  }
}

window.applyConfig = render;
window.setPreviewScale = (s) => { stage.style.transform = `scale(${s})`; };

/* ---- toolbar wiring ---- */
function activate(btn) {
  document.querySelectorAll(".tb-actions button[data-demo]").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
}
document.querySelectorAll(".tb-actions button[data-demo]").forEach((btn) => {
  btn.addEventListener("click", () => {
    activate(btn);
    render(DEMOS[btn.dataset.demo]);
  });
});

const editor = document.getElementById("editor");
const cfgText = document.getElementById("cfgText");
const cfgErr = document.getElementById("cfgErr");
document.getElementById("editBtn").addEventListener("click", () => {
  cfgText.value = JSON.stringify(DEMOS["dark-solo"], null, 2);
  cfgErr.textContent = "";
  editor.classList.remove("hidden");
});
document.getElementById("closeEditor").addEventListener("click", () => editor.classList.add("hidden"));
document.getElementById("applyCfg").addEventListener("click", () => {
  try {
    render(JSON.parse(cfgText.value));
    cfgErr.textContent = "";
  } catch (e) {
    cfgErr.textContent = e.message;
  }
});
document.getElementById("copyCfg").addEventListener("click", () => {
  navigator.clipboard?.writeText(cfgText.value);
});

/* Start with the first demo so a bare load is never blank. */
render(DEMOS["dark-solo"]);
</script>
</body>
</html>
