<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBA Podcast Thumbnail Template — 1280×720</title>

<!--
  ┌────────────────────────────────────────────────────────────────────────────┐
  │  OBA Podcast Thumbnail Template                                            │
  │  Reusable, data-driven, modular headshot layout for podcast speakers and   │
  │  panelists. Styled to match oba-website (Qoves-inspired design system).    │
  │                                                                            │
  │  HOW TO USE                                                                 │
  │  1. Open this file in a browser.                                           │
  │  2. Click a demo button (1 Guest / Guest + Host / 4 Panelists / Crowd).    │
  │  3. Click "Edit JSON" → change episode, title, category, guests → Render.  │
  │  4. Export at 1280×720 (×2 for retina) via the render script or a browser  │
  │     screenshot. See README.md.                                             │
  │                                                                            │
  │  HEADSHOTS: each guest object supports `img` (relative path next to this   │
  │  file, absolute path, or a data: URI). No photo? The template falls back   │
  │  to a monogram + "Portrait" placeholder.                                   │
  └────────────────────────────────────────────────────────────────────────────┘
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
/* ============================================================
   OBA design tokens (mirrored from oba-website/src/app/globals.css)
   ============================================================ */
:root {
  --ink-900: #16232c;
  --ink-800: #22323d;
  --ink-700: #31434f;
  --ink-600: #465a66;
  --accent-600: #3d5361;
  --white: #ffffff;

  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
    monospace;

  /* Cinematic slate backdrop — identical to --gradient-hero in globals.css */
  --gradient-hero: radial-gradient(
    115% 90% at 78% 30%,
    #5b7484 0%,
    #3e5361 34%,
    #263743 62%,
    #16232c 100%
  );
  /* Glow lobe — identical to --gradient-hero-glow */
  --gradient-hero-glow: radial-gradient(
    60% 55% at 72% 42%,
    rgba(214, 228, 235, 0.5) 0%,
    rgba(214, 228, 235, 0) 70%
  );
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: #0d151b;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ============================================================
   Toolbar (not part of the exported thumbnail)
   ============================================================ */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 14px 20px;
  background: #101b22;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  color: rgba(255, 255, 255, 0.85);
  position: sticky;
  top: 0;
  z-index: 20;
}
.toolbar .tb-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.toolbar .tb-sub {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.45);
  margin-top: 2px;
}
.tb-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tb-actions button {
  font: 500 12px var(--font-sans);
  letter-spacing: 0.02em;
  color: rgba(255, 255, 255, 0.75);
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.tb-actions button:hover { background: rgba(255, 255, 255, 0.12); }
.tb-actions button.active {
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.3);
}

.stage {
  margin: 24px auto;
  position: relative;
  transform-origin: top left;
}
.canvas {
  width: 1280px;
  height: 720px;
  position: relative;
  overflow: hidden;
  color: var(--white);
  background: var(--gradient-hero);
  padding: 44px 56px 40px;
  display: flex;
  flex-direction: column;
}

/* ---- background layers ---- */
.layer { position: absolute; inset: 0; pointer-events: none; }
.glow { background: var(--gradient-hero-glow); opacity: 0.45; }
.dots {
  background-image: radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.09) 1px, transparent 0);
  background-size: 18px 18px;
  opacity: 0.55;
  -webkit-mask-image: linear-gradient(90deg, transparent 24%, #000 70%);
  mask-image: linear-gradient(90deg, transparent 24%, #000 70%);
}
.scrim {
  background: linear-gradient(
    90deg,
    rgba(11, 18, 32, 0.52) 0%,
    rgba(11, 18, 32, 0.26) 40%,
    rgba(11, 18, 32, 0) 60%
  );
}

/* ---- top bar ---- */
.top {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 22px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.66);
  white-space: nowrap;
}
.eyebrow::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  flex: none;
}
.logo {
  height: 30px;
  width: auto;
  opacity: 0.95;
}

/* ---- middle: title + headshot rail ---- */
.middle {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 48px;
  min-height: 0;
}
.title-col { flex: 1; min-width: 0; max-width: 660px; }
.title { margin: 0; }
.title h1 {
  margin: 0;
  font-family: var(--font-sans);
  font-weight: 300;
  font-size: 50px;
  line-height: 1.08;
  letter-spacing: -0.02em;
  color: var(--white);
  text-wrap: balance;
}
.title .dim { color: rgba(255, 255, 255, 0.55); }

.rail {
  display: grid;
  gap: 18px;
  flex: none;
}
.rail.count-1 { grid-template-columns: repeat(1, 320px); grid-template-rows: repeat(1, 400px); }
.rail.count-2 { grid-template-columns: repeat(2, 264px); grid-template-rows: repeat(1, 330px); }
.rail.count-3 { grid-template-columns: repeat(3, 178px); grid-template-rows: repeat(1, 230px); }
.rail.count-4 { grid-template-columns: repeat(4, 134px); grid-template-rows: repeat(1, 175px); }
.rail.count-5,
.rail.count-6 { grid-template-columns: repeat(3, 148px); grid-template-rows: repeat(2, 192px); }
.rail.circles { grid-template-columns: repeat(4, 96px); grid-template-rows: repeat(2, 96px); gap: 16px; }

.tile {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  margin: 0;
  border: 1px solid rgba(255, 255, 255, 0.16);
  box-shadow: 0 20px 48px -12px rgba(11, 18, 32, 0.55),
    inset 0 0 0 1px rgba(255, 255, 255, 0.04);
  background: linear-gradient(
    165deg,
    rgba(255, 255, 255, 0.16) 0%,
    rgba(255, 255, 255, 0.05) 42%,
    rgba(11, 18, 32, 0.35) 100%
  );
}
.monogram {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 300;
  letter-spacing: 0.04em;
  color: rgba(255, 255, 255, 0.9);
}
.rail.count-1 .monogram { font-size: 84px; }
.rail.count-2 .monogram { font-size: 64px; }
.rail.count-3 .monogram { font-size: 44px; }
.rail.count-4 .monogram,
.rail.count-5 .monogram,
.rail.count-6 .monogram { font-size: 34px; }
.rail.circles .monogram { font-size: 30px; }

.tile img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.tile figcaption {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  z-index: 2;
}
.tile-index,
.tile-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.85);
  background: rgba(11, 18, 32, 0.42);
  border: 1px solid rgba(255, 255, 255, 0.12);
  padding: 4px 8px;
  border-radius: 999px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.tile-index { color: rgba(255, 255, 255, 0.55); }
/* Long names must never shove the index pill off the tile: let the label
   shrink (and ellipsize) instead, and pin the index pill. */
.tile-label { min-width: 0; }
.tile-index { flex-shrink: 0; }
.rail.count-1 .tile-index { display: none; }
.rail.circles .tile figcaption { display: none; }
.rail.circles .tile { border-radius: 50%; }

/* ---- footer ---- */
.bottom { position: relative; margin-top: 26px; }
.rule { border-top: 1px solid rgba(255, 255, 255, 0.14); }
.byline { padding-top: 18px; }
.guest-name {
  font-size: 22px;
  font-weight: 500;
  line-height: 1.25;
  color: var(--white);
}
.guest-role {
  margin-top: 3px;
  font-size: 15px;
  color: rgba(255, 255, 255, 0.6);
  line-height: 1.4;
}
.byline .sep { color: rgba(255, 255, 255, 0.4); margin: 0 7px; }
.byline.many .guest-name { font-size: 19px; }
.byline.many .guest-role { font-size: 14px; }

.foot-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding-top: 16px;
}
.category {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.55);
  white-space: nowrap;
}
.category::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  flex: none;
}
.waveform { display: flex; align-items: flex-end; gap: 3px; }
.waveform span {
  width: 3px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.28);
}

/* ============================================================
   JSON editor (not part of the exported thumbnail)
   ============================================================ */
.editor {
  max-width: 1280px;
  margin: 0 auto 40px;
  padding: 0 20px;
}
.editor textarea {
  width: 100%;
  height: 320px;
  resize: vertical;
  background: #0d151b;
  color: #d7e1e6;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  padding: 14px;
  font: 12px/1.55 var(--font-mono);
  outline: none;
}
.editor textarea:focus { border-color: rgba(255, 255, 255, 0.35); }
.editor-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}
.editor-actions button {
  font: 500 13px var(--font-sans);
  color: #0d151b;
  background: #fff;
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  padding: 8px 16px;
  cursor: pointer;
}
.editor-actions button.secondary {
  background: transparent;
  color: rgba(255, 255, 255, 0.75);
}
.editor .err { font: 12px var(--font-mono); color: #ff8f8f; margin-left: 6px; }
.hidden { display: none; }
</style>
</head>

let currentConfig = DEMOS.solo;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function initials(name) {
  return String(name)
    .replace(/,.*$/, "")                 // drop "MD, MBA" credentials
    .split(/[\s·–—-]+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((w) => w[0])
    .join("")
    .toUpperCase();
}

function render(cfg) {
  const guests = (cfg.guests || []).filter(Boolean);
  const n = guests.length;

  document.getElementById("eyebrow").textContent = cfg.eyebrow || "OBA · Podcast";

  const titleHTML = (cfg.title || [])
    .map(
      (frag) =>
        `<span class="${frag.dim ? "dim" : ""}">${esc(frag.text)}</span>${frag.br ? "<br>" : ""}`,
    )
    .join("");
  document.getElementById("titleCol").innerHTML = `<div class="title"><h1>${titleHTML}</h1></div>`;

  const rail = document.getElementById("rail");
  const railClass = n > 6 ? "rail circles" : "rail count-" + Math.min(Math.max(n, 1), 6);
  rail.className = railClass;
  rail.innerHTML = guests
    .map((g, i) => {
      const img = g.img
        ? `<img src="${esc(g.img)}" alt="${esc(g.name)}" onerror="this.style.display='none'">`
        : "";
      return (
        `<figure class="tile" title="${esc(g.name)}">` +
        `<div class="monogram">${esc(initials(g.name)) || "?"}</div>` +
        img +
        `<figcaption>` +
        `<span class="tile-index">${String(i + 1).padStart(2, "0")}</span>` +
        `<span class="tile-label">${g.img ? esc(g.short || g.name) : "Portrait"}</span>` +
        `</figcaption></figure>`
      );
    })
    .join("");

  const byline = document.getElementById("byline");
  byline.className = "byline" + (n > 1 ? " many" : "");
  /* Placeholder tiles (gen.mjs `speakers` padding) fill the grid but are
     not named guests, so they never appear in the footer byline. */
  const real = guests.filter((g) => !g.placeholder);
  if (real.length === 1) {
    const g = real[0];
    byline.innerHTML =
      `<div class="guest-name">${esc(g.name)}</div>` +
      (g.role ? `<div class="guest-role">${esc(g.role)}</div>` : "");
  } else if (real.length > 1) {
    const names = real.map((g) => esc(g.name)).join('<span class="sep">·</span>');
    const roles = real.every((g) => g.role)
      ? real.map((g) => esc(g.role)).join('<span class="sep">·</span>')
      : "";
    byline.innerHTML =
      `<div class="guest-name">With ${names}</div>` +
      (roles ? `<div class="guest-role">${roles}</div>` : "");
  } else {
    byline.innerHTML = "";
  }

  document.getElementById("category").textContent = cfg.category || "";

  document.getElementById("waveform").innerHTML = WAVE_HEIGHTS.map(
    (h) => `<span style="height:${((h / 100) * 26).toFixed(1)}px"></span>`,
  ).join("");
}

/* Exposed so the render script can inject configs from the outside. */
function applyConfig(cfg) {
  currentConfig = JSON.parse(JSON.stringify(cfg));
  render(currentConfig);
  window.__currentConfig = currentConfig;
  return currentConfig;
}
window.applyConfig = applyConfig;

/* ============================================================
   Preview scaling — the canvas is a fixed 1280×720; scale it to
   fit the window. The render script forces scale = 1 for exports.
   ============================================================ */
function setPreviewScale(s) {
  const stage = document.getElementById("stage");
  const canvas = document.getElementById("canvas");
  canvas.style.transform = `scale(${s})`;
  canvas.style.transformOrigin = "top left";
  stage.style.width = `${1280 * s}px`;
  stage.style.height = `${720 * s}px`;
}
window.setPreviewScale = setPreviewScale;

function fitPreview() {
  const tb = document.getElementById("toolbar").offsetHeight;
  const s = Math.min(1, (window.innerWidth - 48) / 1280, (window.innerHeight - tb - 48) / 720);
  setPreviewScale(Math.max(s, 0.2));
}

/* ============================================================
   Toolbar + editor wiring
   ============================================================ */
document.querySelectorAll(".tb-actions button[data-demo]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tb-actions button[data-demo]").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    applyConfig(DEMOS[btn.dataset.demo]);
  });
});

const editor = document.getElementById("editor");
const cfgText = document.getElementById("cfgText");
const cfgErr = document.getElementById("cfgErr");

document.getElementById("editBtn").addEventListener("click", () => {
  cfgText.value = JSON.stringify(currentConfig, null, 2);
  cfgErr.textContent = "";
  editor.classList.toggle("hidden");
  if (!editor.classList.contains("hidden")) cfgText.focus();
});

document.getElementById("applyCfg").addEventListener("click", () => {
  try {
    applyConfig(JSON.parse(cfgText.value));
    cfgErr.textContent = "✓ rendered";
  } catch (e) {
    cfgErr.textContent = "Invalid JSON: " + e.message;
  }
});

document.getElementById("closeEditor").addEventListener("click", () => {
  editor.classList.add("hidden");
});

document.getElementById("copyCfg").addEventListener("click", async () => {
  const json = JSON.stringify(currentConfig, null, 2);
  try {
    await navigator.clipboard.writeText(json);
    cfgErr.textContent = "✓ copied";
  } catch {
    cfgText.value = json;
    cfgText.select();
    document.execCommand("copy");
    cfgErr.textContent = "✓ copied";
  }
});
