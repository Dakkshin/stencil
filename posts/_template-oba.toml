# Panel social post — copy this file to <name>.toml and fill it in.
# Then run:  node gen.mjs <name>

post_type = "the_intro"        # the_intro | intro_panel_one | intro_panel_two |
                                # one_more_day | happening_today | panel | speaker_promo
brand = "OBA"                  # OBA | VET
formats = ["square", "portrait", "story", "landscape"]   # default: all four
# portrait_tone = "bw"         # speaker_promo only: default "color"; "bw" opts into grayscale

# campaign + output_name for subdir + custom stems (e.g. speaker intros):
# campaign = "2026-09-17-referral-growth-panel"
# output_name = "The_Intro"   # +1 panelist => The_Intro_Name stem; writes to out/<campaign>/<fmt>/...@2x.png (clean name)
# person = "first-last"       # optional: own out/<campaign>/<person>/<fmt>/ bucket for their set (omit => shared/)

eyebrow = "OBA · Expert Panel"
category = "Referral Growth · OD Partnerships"

# Headline — one string per line. Prefix a line with "~" to make it the
# dimmed second-tone line. Long lines wrap automatically.
title = [
  "Building OD Partnerships",
  "~That Actually Drive Patient Volume",
]

# Optional urgency pill (happening_today) …
# urgency = "Happening today!"

# … or a countdown (one_more_day):
# [countdown]
# number = "1"
# label = "More day to go"

# Panelists: reference profiles by filename stem …
panelists = [
  "chris-bonsall",
  "sean-hanlon",
  "amanda-cardwell",
  "christine-lapointe",
]

# … or inline them. Inline fields override the profile for this post only.
# [[panelists]]
# name = "Someone New"
# credentials = "MD"
# role = "Ophthalmologist"
# company = ""
# short = "S. New"
# photo = ""
# quote = ""

[event]
name = "OBA Expert Panel"
date = "Sep 17th, 2026"
time = "12:00 PM – 1:00 PM EDT"
website = "oba.academy"
cta = "Register Now"
# qr = "register.png"          # optional QR image — drop it in qrs/ and use
                                # the bare filename (old relative paths also work).
                                # Group posts: square shows the QR below the
                                # headline (frosted frame + SCAN TO/REGISTER);
                                # portrait/story/landscape keep the footer QR.
                                # speaker_promo: top-right QR block when set.
